name: Profile Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-check:
    name: Profile Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate profile files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md banner.svg; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty $file"
              exit 1
            fi
          done

          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|README.md|banner.svg)
                ;;
              *)
                echo "::error::Unexpected profile file: $file"
                exit 1
                ;;
            esac
          done

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree

          if ElementTree.parse("banner.svg").getroot().tag != "{http://www.w3.org/2000/svg}svg":
              raise SystemExit("::error::banner.svg must have an SVG root")

          class BannerReference(HTMLParser):
              found = False

              def handle_starttag(self, tag, attrs):
                  if tag == "img" and dict(attrs).get("src") == "banner.svg":
                      self.found = True

          reference = BannerReference()
          reference.feed(Path("README.md").read_text(encoding="utf-8"))
          if not reference.found:
              raise SystemExit("::error::README.md must display banner.svg")
          PY
